name: Scout V0 Live Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/live-smoke.yml"

permissions:
  contents: read

jobs:
  live-read-only:
    name: Live Solana Read-Only Test
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.80
        run: |
          rustup toolchain install 1.80.0 --profile minimal
          rustup default 1.80.0

      - name: Resolve Rust 1.80 dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo update -p tinyvec --precise 1.12.0

      - name: Verify read-only capability
        shell: bash
        run: |
          set -euo pipefail

          if grep -RniE \
            --include='*.rs' \
            'Keypair|seed phrase|private.?key|send_transaction|sendTransaction|send_bundle|sendBundle|tpu.?client|jito.?searcher' \
            crates/
          then
            echo "Forbidden execution/signing capability marker detected."
            exit 1
          fi

          echo "Read-only capability verified."

      - name: Run live Solana stream
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s cargo run --locked -p scout-cli

      - name: Upload Rung 12 shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rung12-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/r12-shadow/*.jsonl
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Rung 13 forensics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rung13-forensics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/r13-forensics/*.jsonl
          if-no-files-found: warn
          retention-days: 14
