name: Scout V0 Live Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/live-smoke.yml"

permissions:
  contents: read

jobs:
  live-read-only:
    name: Live Solana Read-Only Test
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run canonical Rust 1.80 preflight
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/preflight-rust.sh

      - name: Run live Solana stream
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s rustup run 1.80.0 cargo run --locked -p scout-cli --bin scout-cli

      - name: Run Orca O1 live pool-state observation
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s rustup run 1.80.0 cargo run --locked -p scout-cli --bin orca-o1-live

      - name: Run Orca O2 live deterministic parity
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s rustup run 1.80.0 cargo run --locked -p scout-cli --bin orca-o2-live

      - name: Upload Rung 12 shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rung12-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/r12-shadow/*.jsonl
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Rung 13 forensics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rung13-forensics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/r13-forensics/*.jsonl
          if-no-files-found: warn
          retention-days: 14
