name: Scout V0 Live Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/live-smoke.yml"

permissions:
  contents: read

jobs:
  preflight:
    name: Canonical Rust 1.80 Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run canonical Rust 1.80 preflight
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/preflight-rust.sh

  scout-live:
    name: Scout Existing Live Smoke
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.80
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.80.0 --profile minimal

      - name: Resolve Rust 1.80 dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.80.0 cargo generate-lockfile
          rustup run 1.80.0 cargo update -p tinyvec --precise 1.12.0

      - name: Run existing Scout live smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s rustup run 1.80.0 cargo run --locked -p scout-cli --bin scout-cli

      - name: Upload Rung 12 shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rung12-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/r12-shadow/*.jsonl
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Rung 13 forensics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rung13-forensics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/r13-forensics/*.jsonl
          if-no-files-found: warn
          retention-days: 14

  orca-o1-live:
    name: Orca O1 Live Observation
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.80
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.80.0 --profile minimal

      - name: Resolve Rust 1.80 dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.80.0 cargo generate-lockfile
          rustup run 1.80.0 cargo update -p tinyvec --precise 1.12.0

      - name: Run Orca O1 live pool-state observation
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s rustup run 1.80.0 cargo run --locked -p scout-cli --bin orca-o1-live

  orca-o2-live:
    name: Orca O2 Live Deterministic Parity
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.80
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.80.0 --profile minimal

      - name: Resolve Rust 1.80 dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.80.0 cargo generate-lockfile
          rustup run 1.80.0 cargo update -p tinyvec --precise 1.12.0

      - name: Run Orca O2 live deterministic parity
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s rustup run 1.80.0 cargo run --locked -p scout-cli --bin orca-o2-live

  orca-route-live:
    name: Orca Cross-Venue Live Route Proof
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.80
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.80.0 --profile minimal

      - name: Resolve Rust 1.80 dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.80.0 cargo generate-lockfile
          rustup run 1.80.0 cargo update -p tinyvec --precise 1.12.0

      - name: Run Orca cross-venue live route proof
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s rustup run 1.80.0 cargo run --locked -p scout-cli --bin orca-route-live

  orca-priority-live:
    name: Orca + Raydium Localized Priority Proof
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.80
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.80.0 --profile minimal

      - name: Resolve Rust 1.80 dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.80.0 cargo generate-lockfile
          rustup run 1.80.0 cargo update -p tinyvec --precise 1.12.0

      - name: Run Orca + Raydium localized priority proof
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s rustup run 1.80.0 cargo run --locked -p scout-cli --bin orca-priority-live
