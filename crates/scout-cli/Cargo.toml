[package]
name = "scout-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "=0.22.1"
bs58 = "=0.5.1"
futures-util = "0.3"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
scout-core = { path = "../scout-core" }
serde_json = "1.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
zeroize = "=1.8.1"

[lints]
workspace = true
