[package]
name = "scout-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "=0.22.1"
bs58 = "=0.5.1"
ethnum = "=1.5.2"
futures-util = "0.3"
hyper-rustls = { version = "=0.27.7", default-features = false, features = ["http1", "tls12", "webpki-tokio"] }
idna_adapter = "=1.1.0"
orca_whirlpools_core = { version = "=2.1.1", default-features = false, features = ["swap"] }
reqwest = { version = "=0.12.18", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
scout-core = { path = "../scout-core" }
serde_json = "1.0"
solana-pubkey = { version = "=2.2.1", default-features = false, features = ["curve25519", "std"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
zeroize = "=1.8.1"

[lints]
workspace = true
